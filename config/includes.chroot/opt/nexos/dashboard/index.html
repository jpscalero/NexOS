<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexOS Security Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --active: #10b981;
            --inactive: #ef4444;
            --accent: #3b82f6;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% -20%, #1e293b, #0f172a);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.05em;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1rem;
            margin-top: 0.5rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.5rem;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2), 0 4px 6px -2px rgba(0, 0, 0, 0.1);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .card-title {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text-main);
            margin: 0;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px currentColor;
        }

        .status-active { color: var(--active); background-color: var(--active); }
        .status-inactive { color: var(--inactive); background-color: var(--inactive); }

        .status-text {
            font-size: 0.875rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .text-active { color: var(--active); }
        .text-inactive { color: var(--inactive); }

        footer {
            margin-top: 3rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        #last-updated {
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>NexOS Dashboard</h1>
            <div class="subtitle">System Security & Infrastructure Monitor</div>
        </header>

        <div class="grid" id="services-grid">
            <!-- Cards will be populated by JS -->
            <div class="card" id="card-tor">
                <div class="card-header">
                    <h2 class="card-title">Tor Network</h2>
                    <span class="status-indicator status-inactive" id="ind-tor"></span>
                </div>
                <div class="status-text text-inactive" id="txt-tor">LOADING</div>
            </div>

            <div class="card" id="card-postgresql">
                <div class="card-header">
                    <h2 class="card-title">PostgreSQL</h2>
                    <span class="status-indicator status-inactive" id="ind-postgresql"></span>
                </div>
                <div class="status-text text-inactive" id="txt-postgresql">LOADING</div>
            </div>

            <div class="card" id="card-mariadb">
                <div class="card-header">
                    <h2 class="card-title">MariaDB</h2>
                    <span class="status-indicator status-inactive" id="ind-mariadb"></span>
                </div>
                <div class="status-text text-inactive" id="txt-mariadb">LOADING</div>
            </div>

            <div class="card" id="card-firewall">
                <div class="card-header">
                    <h2 class="card-title">Firewall (UFW)</h2>
                    <span class="status-indicator status-inactive" id="ind-firewall"></span>
                </div>
                <div class="status-text text-inactive" id="txt-firewall">LOADING</div>
            </div>
        </div>

        <footer>
            Last Updated: <span id="last-updated">--</span>
        </footer>
    </div>

    <script>
        function updateDashboard() {
            // In a real environment, this fetches the local status.json
            // We use cache-busting to ensure we don't get a stale file
            fetch('status.json?t=' + new Date().getTime())
                .then(response => {
                    if (!response.ok) throw new Error("Network response was not ok");
                    return response.json();
                })
                .then(data => {
                    document.getElementById('last-updated').innerText = data.timestamp;

                    for (const [service, status] of Object.entries(data.services)) {
                        const ind = document.getElementById('ind-' + service);
                        const txt = document.getElementById('txt-' + service);
                        
                        if (ind && txt) {
                            if (status === 'active') {
                                ind.className = 'status-indicator status-active';
                                txt.className = 'status-text text-active';
                                txt.innerText = 'ACTIVE';
                            } else {
                                ind.className = 'status-indicator status-inactive';
                                txt.className = 'status-text text-inactive';
                                txt.innerText = 'INACTIVE';
                            }
                        }
                    }
                })
                .catch(error => {
                    console.error('Error fetching status:', error);
                    document.getElementById('last-updated').innerText = 'ERROR (Check Console)';
                });
        }

        // Fetch immediately on load
        updateDashboard();
        
        // Update every 30 seconds
        setInterval(updateDashboard, 30000);
    </script>
</body>
</html>
