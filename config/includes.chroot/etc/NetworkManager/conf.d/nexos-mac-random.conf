# ============================================================
#  NexOS — NetworkManager MAC Randomization
#  /etc/NetworkManager/conf.d/nexos-mac-random.conf
#  Random MAC address for WiFi privacy
# ============================================================

[device]
wifi.scan-rand-mac-address=yes

[connection]
wifi.cloned-mac-address=random
ethernet.cloned-mac-address=preserve
connection.stable-id=${CONNECTION}/${BOOT}
