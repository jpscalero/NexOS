# ============================================================
#  NexOS — Kernel Module Blacklist
#  /etc/modprobe.d/nexos-blacklist.conf
#  Disable unnecessary and potentially dangerous modules
# ============================================================

# Disable unused network protocols
install dccp /bin/true
install sctp /bin/true
install rds /bin/true
install tipc /bin/true

# Disable obsolete/insecure filesystems
install cramfs /bin/true
install freevxfs /bin/true
install jffs2 /bin/true
install hfs /bin/true
install hfsplus /bin/true
install udf /bin/true

# Disable Firewire (DMA attack vector)
install firewire-core /bin/true
install firewire-net /bin/true
install firewire-sbp2 /bin/true
install firewire-ohci /bin/true
install ohci1394 /bin/true
install sbp2 /bin/true
install dv1394 /bin/true
install raw1394 /bin/true
install video1394 /bin/true

# Disable Thunderbolt (DMA attack vector - enable if needed)
# install thunderbolt /bin/true

# Disable Bluetooth (uncomment if not needed)
# install bluetooth /bin/true
# install btusb /bin/true
