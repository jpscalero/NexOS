# ============================================================
#  NexOS — Proxychains4 Configuration
#  /etc/proxychains4.conf
# ============================================================

# Dynamic chain - each connection goes through the chain
# If a proxy is down, it's skipped
dynamic_chain

# Quiet mode (no output from the library)
quiet_mode

# Proxy DNS requests - prevents DNS leaks
proxy_dns

# Timeouts
tcp_read_time_out 15000
tcp_connect_time_out 8000

# Default proxy list
# Tor SOCKS5 proxy
[ProxyList]
socks5 127.0.0.1 9050
