# ============================================================
#  NexOS — Kernel Hardening via sysctl
#  /etc/sysctl.d/99-nexos-hardening.conf
# ============================================================

# ── Network Security ─────────────────────────────────────
# Prevent SYN flood attacks
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_max_syn_backlog = 2048
net.ipv4.tcp_synack_retries = 2

# Prevent IP spoofing
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Disable ICMP redirects (prevent MITM attacks)
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# Disable source routing
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# Ignore ICMP broadcast requests
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Ignore bogus ICMP responses
net.ipv4.icmp_ignore_bogus_error_responses = 1

# Log martian packets (suspicious)
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# Disable IP forwarding (enable only if routing)
net.ipv4.ip_forward = 0
net.ipv6.conf.all.forwarding = 0

# ── Kernel Security ──────────────────────────────────────
# ASLR (Address Space Layout Randomization) - maximum
kernel.randomize_va_space = 2

# Restrict kernel pointer access
kernel.kptr_restrict = 2

# Restrict dmesg access
kernel.dmesg_restrict = 1

# Disable sysrq (magic SysRq key)
kernel.sysrq = 0

# Restrict ptrace (process tracing)
kernel.yama.ptrace_scope = 1

# Restrict unprivileged user namespaces
kernel.unprivileged_userns_clone = 0

# Core dumps
fs.suid_dumpable = 0

# ── Memory Protection ────────────────────────────────────
# Protect against hardlink/symlink attacks
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2

# ── TCP/IP Performance & Security ────────────────────────
# Enable TCP BBR congestion control
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# TCP keepalive
net.ipv4.tcp_keepalive_time = 600
net.ipv4.tcp_keepalive_intvl = 60
net.ipv4.tcp_keepalive_probes = 5

# Increase network buffer sizes
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
